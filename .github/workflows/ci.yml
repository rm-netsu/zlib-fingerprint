name: CI

on:
  push:
  pull_request:

# The zlib-engine CI moved into the zlib-replicant package together with
# the engine and its differential-testing infrastructure — see
# zlib-replicant/.github/workflows/ci.yml (engine unit tests, golden-
# corpus regression incl. official wrappers, official reference-binary
# build, streaming + extended one-shot differential matrices, archived
# results). This workflow keeps the repository-level checks: the
# fingerprint search, its integration with the engine package, and the
# sibling miniz / zlib-ng engines.

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - name: Unit tests (search + zlib-replicant engine)
        run: zig build test
      - name: Release build
        run: zig build -Doptimize=ReleaseFast
      # The regression fixtures and the differential suites of the zlib
      # engine are part of the engine repository, not of the fetched
      # dependency (the package's zon .paths ships the engine only).
      # Clone it at the exact tag pinned in build.zig.zon, so the suites
      # run against the same engine version the build consumes.
      - name: Clone the zlib-replicant engine repository (differential suites)
        run: >
          git clone --depth 1 --branch v0.1.1
          https://github.com/rm-netsu/zlib-replicant.git zlib-replicant
      - name: Regression fixtures (engines + search, official wrappers off)
        run: python3 zlib-replicant/scripts/regression_check.py --skip-official
      - name: Native miniz + zlib-ng differentials (vs official wrappers)
        run: |
          bash binaries/build-binaries.sh || true
          python3 scripts/diff_native_miniz.py --jobs $(nproc)
          python3 scripts/diff_native_zlibng.py --jobs $(nproc)
